[package]
name = "accounting-api"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.52", features = ["sync", "rt-multi-thread", "macros"] }
axum = { version = "0.8.9", features = [
    "http1",
    "http2",
    "json",
    "tokio",
    "tracing",
    "macros",
] }
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "time",
    "postgres",
    "uuid",
    "json",
    "macros",
    "migrate",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23", features = ["v4", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
time = { version = "0.3.47", features = ["serde", "serde-well-known"] }
time-macros = "0.2.22"
tower-http = { version = "0.6.11", features = ["cors"] }
thiserror = "2.0"
utoipa = { version = "5.5", features = ["axum_extras", "uuid", "time"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }
